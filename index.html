<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <link rel="stylesheet" href="styles/generics.css">
  <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

  <main>
    <article class="card">
      <img class="card__img" src="assets/images/avatar-jessica.jpeg" alt="Image of Jessica Randall">

      <h1 class="card__name">Afsar Miah</h1>
      <p class="card__location">London, United Kingdom</p>
      <p class="card__quote">"Front-end developer and avid reader."</p>

      <nav class="card__links" aria-label="Social media links">
        <a class="card__links-social" href="#">GitHub</a>
        <a class="card__links-social" href="#">Frontend Mentor</a>
        <a class="card__links-social" href="#">LinkedIn</a>
        <a class="card__links-social" href="#">Twitter</a>
        <a class="card__links-social" href="#">Instagram</a>
      </nav>
    </article>
  </main>

  <!-- added a main
   added an article tag
   added an addres tag
   added a nav tag
   fixed my bem classes -->

  <!--
   changes address to p
   added aria labels
   added var fonts to everything -->

</body>

</html>
